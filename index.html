<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main class="main">
      <section class="card">
        <img class="image" src="assets/images/avatar-jessica.jpeg" />
        <span class="name">Jessica Randall</span>
        <span class="location">London, United Kingdom</span>
        <span class="phrase">"Front-end developer and avid reader."</span>
        <div class="buttons-social">
          <input type="button" value="GitHub" />
          <input type="button" value="Frontend Mentor" />
          <input type="button" value="LinkedIn" />
          <input type="button" value="Twitter" />
          <input type="button" value="Instagram" />
        </div>
      </section>
    </main>
  </body>
</html>
